- name: x86_64 | Install other packages unavailable/unnecessary on ALARM # noqa: name[casing]
  community.general.pacman:
    state: present
    name: "{{ item }}"
  loop:
    - amd-ucode # microcode
    - edk2-ovmf # virtualization
    - intel-media-driver # VAAPI
    - intel-ucode # microcode
    - libva-intel-driver # VAAPI
    - libva-mesa-driver # VAAPI
    - libva-utils # VAAPI
    - libvirt # virtualization
    - linux # kernel
    - linux-firmware # kernel
    - linux-headers # kernel
    - pandoc
    - qemu-full # virtualization
    - qemu-user-static-binfmt # architecture emulation
    - reflector # mirrors
    - shellcheck # code
    - virt-manager # virtualization
    - vulkan-intel # video driver
    - vulkan-radeon # video driver
  when: ansible_facts['architecture'] == "x86_64"
  tags: packages
  become: true

- name: x86_64 | Install multilib packages # noqa: name[casing]
  community.general.pacman:
    name: "{{ item }}"
    state: present
  loop:
    - lib32-mesa # video driver
    - lib32-vulkan-intel # video driver
    - lib32-vulkan-radeon # video driver
    - steam # games
    - wine # windows
  when: ansible_facts['architecture'] == "x86_64"
  tags: packages
  become: true

